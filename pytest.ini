[pytest]
testpaths = tests
# Default tier only; pick another tier with -m (a -m on the command line replaces this one).
addopts = -m "not slow and not tools and not browser" -p no:cacheprovider -p no:jaxtyping -ra
markers =
    slow: larger bundles located by env var (minutes)
    tools: real Baysor / Proseg / R runs on a very small region; skipped when the tool is missing
    browser: node + Playwright tests of the WebGL viewer; skipped when unavailable
filterwarnings =
    ignore
